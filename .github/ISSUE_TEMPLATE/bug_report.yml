name: Reporte de error
description: Algo no funciona como se espera
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: ¿Qué pasó?
      description: Comportamiento observado y comportamiento esperado.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: "1. docker compose up\n2. ..."
    validations: { required: true }
  - type: input
    id: task
    attributes:
      label: task_id afectado (si aplica)
  - type: textarea
    id: logs
    attributes:
      label: Logs relevantes
      render: json
  - type: dropdown
    id: env
    attributes:
      label: Entorno
      options: [Docker Compose, Linux (systemd), Windows Server (NSSM)]
    validations: { required: true }
