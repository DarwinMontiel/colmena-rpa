[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "colmena-rpa"
version = "2.0.0"
description = "Colmena RPA: bots obreros distribuidos con RabbitMQ, trazabilidad en PostgreSQL y monitoreo centralizado para operaciones de cobranza."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Darwin Montiel Mora", email = "darwinmontielm@gmail.com" }]
keywords = ["rpa", "rabbitmq", "postgresql", "playwright", "fastapi", "automatizacion", "cobranza", "cartera"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: Spanish",
]
dependencies = [
    "pika>=1.3,<2",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
    "structlog>=24.1",
    "typer>=0.12",
    "playwright>=1.47",
]

[project.urls]
Repositorio = "https://github.com/DarwinMontiel/colmena-rpa"
Demo = "https://darwinmontiel.github.io/colmena-rpa/"
Cambios = "https://github.com/DarwinMontiel/colmena-rpa/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
colmena-obrera = "colmena_rpa.worker.main:main"
colmena-carga = "colmena_rpa.producer.cli:app"
colmena-monitor = "colmena_rpa.monitor.main:main"
# Alias de compatibilidad con la v1 (nombres anteriores al renombre).
rpa-worker = "colmena_rpa.worker.main:main"
rpa-producer = "colmena_rpa.producer.cli:app"
rpa-monitor = "colmena_rpa.monitor.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/colmena_rpa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration and not e2e'"
markers = [
    "integration: requiere RabbitMQ y PostgreSQL reales (docker compose)",
    "e2e: bot real con Playwright contra el portal demo (playwright install chromium)",
]

[tool.coverage.run]
source = ["colmena_rpa"]
omit = ["*/worker/main.py", "*/monitor/main.py", "*/bots/payment_agreement.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "S", "PT"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"src/colmena_rpa/demo_portal/**" = ["S105", "S311"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pika.*"]
ignore_missing_imports = true
