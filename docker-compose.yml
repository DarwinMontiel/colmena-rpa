# Colmena RPA completa en local:  docker compose up --build -d
#   Monitor:        http://localhost:8000
#   RabbitMQ UI:    http://localhost:15672  (guest / guest)
#   Portal demo:    http://localhost:8001
# Encolar el lote de ejemplo (las fechas del CSV son relativas a hoy):
#   docker compose run --rm carga colmena-carga encolar --archivo data/sample_tasks.csv
# Más obreras:
#   docker compose up -d --scale obrera=4

name: colmena-rpa

x-app: &app
  build: .
  image: colmena-rpa:local
  env_file: .env.example
  environment:
    RPA_DATABASE_URL: postgresql+psycopg://rpa:rpa@postgres:5432/rpa
    RPA_AMQP_URL: amqp://guest:guest@rabbitmq:5672/%2F
    RPA_PORTAL_URL: http://portal:8001
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }

x-http-healthcheck: &http-healthcheck
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 10s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rpa
      POSTGRES_PASSWORD: rpa
      POSTGRES_DB: rpa
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpa -d rpa"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  migrate:
    build: .
    image: colmena-rpa:local
    environment:
      RPA_DATABASE_URL: postgresql+psycopg://rpa:rpa@postgres:5432/rpa
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  portal:
    build: .
    image: colmena-rpa:local
    command: ["uvicorn", "colmena_rpa.demo_portal.app:build", "--factory", "--host", "0.0.0.0", "--port", "8001"]
    ports: ["8001:8001"]
    environment:
      PORTAL_FAILURE_RATE: "0.15"  # 15 % de respuestas 503 para ejercitar los reintentos
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8001/health', timeout=3)"]

  obrera:
    <<: *app
    command: ["colmena-obrera"]
    deploy:
      replicas: 2
    volumes: [artifacts:/app/artifacts]
    restart: unless-stopped

  monitor:
    <<: *app
    command: ["colmena-monitor"]
    ports: ["8000:8000"]
    restart: unless-stopped
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]

  carga:
    <<: *app
    command: ["colmena-carga", "--help"]
    profiles: ["tools"]

volumes:
  pgdata:
  artifacts:
